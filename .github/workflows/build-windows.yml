name: Build (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      spotify_device:
        description: "Build the Spotify Connect device (SpotifyHelper, needs cargo) into ReSkate.dll"
        type: boolean
        default: true
      package_zip:
        description: "Also package a release ZIP (contrib/package_release_zip.py)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      BUILD_DIR: build/vs2022-x64
      # CI builds report crashes only when the repository sets this variable (empty disables uploads).
      RESKATE_CRASH_REPORT_URL: ${{ vars.RESKATE_CRASH_REPORT_URL }}
      SPOTIFY_DEVICE: ${{ github.event_name != 'workflow_dispatch' || inputs.spotify_device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version comes from the latest tag, and the crash
          # report revision from git describe.
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 --match "v[0-9]*" 2>$null
          $version = "0.0.0"
          if ($LASTEXITCODE -eq 0 -and $tag -match '^v?(\d+\.\d+\.\d+.*)$') { $version = $Matches[1] }
          $short = (git rev-parse --short=12 HEAD).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          Write-Host "DINGOSDK_VERSION=$version ($short)"

      # SpotifyHelper is a Rust library linked into ReSkate.dll when cargo is found. CMake globs
      # cargo's registry for the windows import library at configure time, so the crates must be
      # fetched before configuring.
      - name: Cache cargo
        if: env.SPOTIFY_DEVICE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            SpotifyHelper/target
          key: cargo-${{ runner.os }}-${{ hashFiles('SpotifyHelper/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch Spotify device crates
        if: env.SPOTIFY_DEVICE == 'true'
        working-directory: SpotifyHelper
        shell: pwsh
        run: |
          cargo --version
          cargo fetch --locked

      - name: Configure
        shell: pwsh
        run: |
          $extra = @()
          # A false cached value stops find_program(DINGOSDK_CARGO) searching, so the DLL is built without it.
          if ($env:SPOTIFY_DEVICE -ne 'true') { $extra += '-DDINGOSDK_CARGO=OFF' }
          cmake --preset vs2022-x64 `
            "-DDINGOSDK_VERSION=${{ steps.version.outputs.version }}" `
            "-DDINGOSDK_CRASH_REPORT_URL=$env:RESKATE_CRASH_REPORT_URL" `
            @extra

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Collect binaries
        shell: pwsh
        run: |
          $out = "$env:BUILD_DIR/Release"
          Get-ChildItem $out -File | Format-Table Name, Length
          foreach ($f in 'ReSkateLauncher.exe', 'ReSkate.dll') {
            if (-not (Test-Path "$out/$f")) { throw "Missing build output: $f" }
          }
          New-Item -ItemType Directory -Force dist/bin, dist/symbols | Out-Null
          Copy-Item "$out/*.exe", "$out/*.dll" dist/bin
          Copy-Item "$out/*.pdb" dist/symbols -ErrorAction SilentlyContinue

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-windows-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: dist/bin/
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-windows-symbols-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: dist/symbols/
          if-no-files-found: warn

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' && inputs.package_zip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package release ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.package_zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item dist/bin/ReSkateLauncher.exe, dist/bin/ReSkate.dll dist/stage
          python contrib/package_release_zip.py dist/stage "dist/ReSkate-${{ steps.version.outputs.version }}.zip"
          python contrib/package_release_zip.py --check "dist/ReSkate-${{ steps.version.outputs.version }}.zip"

      - name: Upload release ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.package_zip
        uses: actions/upload-artifact@v4
        with:
          name: ReSkate-release-zip-${{ steps.version.outputs.version }}
          path: dist/ReSkate-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
